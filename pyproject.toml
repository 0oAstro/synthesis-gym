[project]
name = "synthgym"
version = "0.1.0"
description = "RL gym for solid-state materials synthesis with a learned oracle checked against real lab outcomes"
requires-python = ">=3.12"
dependencies = [
    "anthropic[bedrock]>=2.3.0",
    "gymnasium>=1.4.0",
    "lightgbm>=4.7.0",
    "matminer>=0.10.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=2.3.3",
    "pydantic>=2.14.2",
    "pymatgen>=2026.10.24",
    "rich>=15.0.0",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = ["pytest>=9.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["synthgym"]
